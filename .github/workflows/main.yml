name: Build jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.0
      - name: Build
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: offhand-shift-click-26.1.2-jar
          path: build/libs/offhand-shift-click-26.1.2-1.0.0.jar
